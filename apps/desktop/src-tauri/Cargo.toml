[package]
name = "quant-nexus-ai"
version = "0.4.0"
edition = "2024"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
quant-nexus-core = { path = "../../../crates/core" }
quick-xml = "0.42"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_UI_Shell"] }
zeroize = "1.9"
