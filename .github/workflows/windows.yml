name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Install locked frontend dependencies
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund
      - name: Check the core
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
      - name: Test the desktop backend
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build executable and NSIS installer
        run: npm.cmd run bundle -- --bundles nsis --ci
      - uses: actions/upload-artifact@v7
        with:
          name: quant-nexus-ai-windows-x64
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/quant-nexus-ai.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
